<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تطبيق المحادثات والمكالمات - Go Broker & WebRTC</title>
    <style>
        * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
        body { background: #0f172a; color: #f8fafc; margin: 0; padding: 20px; display: flex; justify-content: center; }
        .app-container { width: 100%; max-width: 900px; display: flex; flex-direction: column; gap: 15px; }
        
        .card { background: #1e293b; padding: 20px; border-radius: 12px; border: 1px solid #334155; }
        .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
        
        input, button { padding: 10px 14px; border-radius: 8px; border: none; font-size: 15px; outline: none; }
        input { background: #334155; color: white; flex: 1; }
        button { background: #2563eb; color: white; cursor: pointer; font-weight: bold; transition: 0.2s; }
        button:hover { background: #1d4ed8; }
        button.secondary { background: #475569; }
        button.secondary:hover { background: #334155; }
        button.danger { background: #dc2626; }
        button.danger:hover { background: #b91c1c; }
        
        /* منطقة الرسائل */
        #chatBox { height: 250px; background: #090d16; border-radius: 8px; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
        .msg { max-width: 75%; padding: 8px 12px; border-radius: 8px; font-size: 14px; word-break: break-word; }
        .msg.me { background: #2563eb; align-self: flex-start; color: white; }
        .msg.other { background: #334155; align-self: flex-end; color: white; }
        .msg.system { background: transparent; color: #94a3b8; align-self: center; font-size: 12px; }

        /* الشاشات والفيديو */
        .video-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 15px; margin-top: 15px; }
        .video-card { position: relative; background: #000; border-radius: 10px; overflow: hidden; height: 220px; border: 1px solid #334155; }
        video { width: 100%; height: 100%; object-fit: cover; }
        .video-label { position: absolute; bottom: 8px; right: 8px; background: rgba(0,0,0,0.6); padding: 4px 8px; border-radius: 4px; font-size: 12px; }

        #status { font-weight: bold; }
    </style>
</head>
<body>

<div class="app-container">
    <h2>تطبيق الرسائل والمكالمات (Go Broker)</h2>

    <!-- 1. تسجيل الدخول والاتصال -->
    <div class="card">
        <div class="row">
            <input type="text" id="userIdInput" placeholder="أدخل معرّفك (مثال: USER_1)">
            <button onclick="connectWebSocket()">الاتصال بالسيرفر 🚀</button>
            <span id="status" style="color: #f59e0b;">غير متصل ❌</span>
        </div>
    </div>

    <!-- 2. تحديد المستلم والتحكم بالمكالمات -->
    <div class="card">
        <div class="row">
            <input type="text" id="targetIdInput" placeholder="معرّف المستلم (مثال: USER_2)">
            <button onclick="startCall(false)" class="secondary">مكالمة صوتية 📞</button>
            <button onclick="startCall(true)">مكالمة فيديو 📹</button>
            <button onclick="endCall()" class="danger">إنهاء المكالمة ✖</button>
        </div>
    </div>

    <!-- 3. شاشات الفيديو والصوت -->
    <div class="video-grid">
        <div class="video-card">
            <video id="localVideo" autoplay playsinline muted></video>
            <div class="video-label">كاميراك (Local)</div>
        </div>
        <div class="video-card">
            <video id="remoteVideo" autoplay playsinline></video>
            <div class="video-label">الطرف الآخر (Remote)</div>
        </div>
    </div>

    <!-- 4. المحادثة النصية -->
    <div class="card">
        <h4>المحادثة النصية</h4>
        <div id="chatBox"></div>
        <div class="row" style="margin-top: 10px;">
            <input type="text" id="messageInput" placeholder="اكتب رسالة..." onkeypress="if(event.key==='Enter') sendTextMessage()">
            <button onclick="sendTextMessage()">إرسال ✉️</button>
        </div>
    </div>
</div>

<script>
    let ws;
    let myId = "";
    let localStream;
    let peerConnection;
    let isVideoCall = true;

    // رابط سيرفر Go المباشر على Render
    const SERVER_URL = "wss://go-broker.onrender.com/ws";

    // سيرفرات STUN المجانية من Google
    const iceServers = {
        iceServers: [
            { urls: 'stun:stun.l.google.com:19302' },
            { urls: 'stun:stun1.l.google.com:19302' }
        ]
    };

    function appendMessage(text, type) {
        const chatBox = document.getElementById('chatBox');
        const msgDiv = document.createElement('div');
        msgDiv.className = `msg ${type}`;
        msgDiv.innerText = text;
        chatBox.appendChild(msgDiv);
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    // 1. الاتصال بالسيرفر
    function connectWebSocket() {
        myId = document.getElementById('userIdInput').value.trim();
        if (!myId) {
            alert('يرجى أدخل معرّفك أولاً');
            return;
        }

        ws = new WebSocket(`${SERVER_URL}?userId=${myId}`);

        ws.onopen = () => {
            document.getElementById('status').innerText = 'متصل ✅';
            document.getElementById('status').style.color = '#10b981';
            appendMessage(`تم الاتصال بنجاح بـ ID: ${myId}`, 'system');
        };

        ws.onmessage = async (event) => {
            const data = JSON.parse(event.data);

            switch (data.type) {
                case 'text':
                    appendMessage(`${data.sender}: ${data.payload.text}`, 'other');
                    break;
                case 'offer':
                    handleOffer(data.sender, data.payload);
                    break;
                case 'answer':
                    handleAnswer(data.payload);
                    break;
                case 'ice_candidate':
                    handleIceCandidate(data.payload);
                    break;
            }
        };

        ws.onclose = () => {
            document.getElementById('status').innerText = 'انقطع الاتصال ❌';
            document.getElementById('status').style.color = '#ef4444';
            appendMessage('تم إغلاق الاتصال بالسيرفر', 'system');
        };
    }

    // 2. إرسال رسالة نصية
    function sendTextMessage() {
        const targetId = document.getElementById('targetIdInput').value.trim();
        const input = document.getElementById('messageInput');
        const text = input.value.trim();

        if (!targetId || !text) {
            alert('تأكد من إدخال معرّف المستلم ونص الرسالة');
            return;
        }

        const msg = {
            type: 'text',
            target: targetId,
            payload: { text: text }
        };

        ws.send(JSON.stringify(msg));
        appendMessage(`أنت: ${text}`, 'me');
        input.value = '';
    }

    // 3. تجهيز الكاميرا / الميكروفون
    async function setupMedia(enableVideo) {
        try {
            localStream = await navigator.mediaDevices.getUserMedia({
                video: enableVideo,
                audio: true
            });
            document.getElementById('localVideo').srcObject = localStream;
        } catch (error) {
            alert('فشل الوصول للكاميرا/الميكروفون: ' + error.message);
        }
    }

    // 4. بدء المكالمة (صوت أو فيديو)
    async function startCall(video) {
        const targetId = document.getElementById('targetIdInput').value.trim();
        if (!targetId) {
            alert('أدخل معرّف الشخص الذي تريد الاتصال به');
            return;
        }

        isVideoCall = video;
        await setupMedia(isVideoCall);
        createPeerConnection(targetId);

        const offer = await peerConnection.createOffer();
        await peerConnection.setLocalDescription(offer);

        appendMessage(`جاري الاتصال بـ ${targetId} (${video ? 'فيديو' : 'صوت'})...`, 'system');
        sendSignal('offer', targetId, { sdp: offer.sdp, type: offer.type, isVideo: video });
    }

    // 5. إنشاء اتصال WebRTC P2P
    function createPeerConnection(targetId) {
        peerConnection = new RTCPeerConnection(iceServers);

        if (localStream) {
            localStream.getTracks().forEach(track => {
                peerConnection.addTrack(track, localStream);
            });
        }

        peerConnection.ontrack = (event) => {
            document.getElementById('remoteVideo').srcObject = event.streams[0];
        };

        peerConnection.onicecandidate = (event) => {
            if (event.candidate) {
                sendSignal('ice_candidate', targetId, event.candidate);
            }
        };
    }

    // 6. التعامل مع إشارات المكالمات الواردة
    async function handleOffer(senderId, payload) {
        document.getElementById('targetIdInput').value = senderId;
        isVideoCall = payload.isVideo ?? true;

        await setupMedia(isVideoCall);
        createPeerConnection(senderId);

        await peerConnection.setRemoteDescription(new RTCSessionDescription(payload));
        const answer = await peerConnection.createAnswer();
        await peerConnection.setLocalDescription(answer);

        appendMessage(`مكالمة واردة من ${senderId}... تم الرد تلقائياً`, 'system');
        sendSignal('answer', senderId, { sdp: answer.sdp, type: answer.type });
    }

    async function handleAnswer(payload) {
        appendMessage('تم بدء المكالمة بنجاح!', 'system');
        await peerConnection.setRemoteDescription(new RTCSessionDescription(payload));
    }

    async function handleIceCandidate(payload) {
        if (peerConnection) {
            await peerConnection.addIceCandidate(new RTCIceCandidate(payload));
        }
    }

    function sendSignal(type, target, payload) {
        if (ws && ws.readyState === WebSocket.OPEN) {
            ws.send(JSON.stringify({ type, target, payload }));
        }
    }

    // 7. إنهاء المكالمة
    function endCall() {
        if (peerConnection) {
            peerConnection.close();
            peerConnection = null;
        }
        if (localStream) {
            localStream.getTracks().forEach(track => track.stop());
        }
        document.getElementById('localVideo').srcObject = null;
        document.getElementById('remoteVideo').srcObject = null;
        appendMessage('تم إنهاء المكالمة', 'system');
    }
</script>

</body>
</html>
