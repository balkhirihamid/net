<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تطبيق المحادثات والمكالمات - Go Broker & WebRTC</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: system-ui, -apple-system, sans-serif;
    }

    body {
      background: #0f172a;
      color: #f8fafc;
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
    }

    .app-container {
      width: 100%;
      max-width: 900px;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .card {
      background: #1e293b;
      padding: 20px;
      border-radius: 12px;
      border: 1px solid #334155;
    }

    .row {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
    }

    input,
    button {
      padding: 10px 14px;
      border-radius: 8px;
      border: none;
      font-size: 15px;
      outline: none;
    }

    input {
      background: #334155;
      color: white;
      flex: 1;
    }

    button {
      background: #2563eb;
      color: white;
      cursor: pointer;
      font-weight: bold;
      transition: 0.2s;
    }

    button:hover {
      background: #1d4ed8;
    }

    button.secondary {
      background: #475569;
    }

    button.secondary:hover {
      background: #334155;
    }

    button.success {
      background: #10b981;
    }

    button.success:hover {
      background: #059669;
    }

    button.danger {
      background: #dc2626;
    }

    button.danger:hover {
      background: #b91c1c;
    }

    /* نافذة مكالمة واردة Modal */
    .incoming-call-banner {
      display: none;
      background: #0284c7;
      padding: 15px;
      border-radius: 12px;
      align-items: center;
      justify-content: space-between;
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0% {
        opacity: 0.9;
      }

      50% {
        opacity: 1;
      }

      100% {
        opacity: 0.9;
      }
    }

    /* منطقة الرسائل */
    #chatBox {
      height: 200px;
      background: #090d16;
      border-radius: 8px;
      padding: 15px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 10px;
    }

    .msg {
      max-width: 75%;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 14px;
      word-break: break-word;
    }

    .msg.me {
      background: #2563eb;
      align-self: flex-start;
      color: white;
    }

    .msg.other {
      background: #334155;
      align-self: flex-end;
      color: white;
    }

    .msg.system {
      background: transparent;
      color: #94a3b8;
      align-self: center;
      font-size: 12px;
    }

    /* الشاشات والفيديو */
    .video-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 15px;
      margin-top: 15px;
    }

    .video-card {
      position: relative;
      background: #000;
      border-radius: 10px;
      overflow: hidden;
      height: 220px;
      border: 1px solid #334155;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .video-label {
      position: absolute;
      bottom: 8px;
      right: 8px;
      background: rgba(0, 0, 0, 0.6);
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 12px;
    }
  </style>
</head>

<body>

  <div class="app-container">
    <h2>تطبيق المحادثات والمكالمات (Go Broker)</h2>

    <!-- 1. تسجيل الدخول والاتصال -->
    <div class="card">
      <div class="row">
        <input type="text" id="userIdInput" placeholder="أدخل معرّفك (مثال: USER_1)">
        <button onclick="connectWebSocket()">الاتصال بالسيرفر 🚀</button>
        <span id="status" style="color: #f59e0b; font-weight: bold;">غير متصل ❌</span>
      </div>
    </div>

    <!-- 2. شريط المكالمات الواردة (تنبيه بالصوت والقبول/الرفض) -->
    <div id="incomingCallBanner" class="incoming-call-banner">
      <div>
        <span id="incomingCallerText" style="font-size: 18px; font-weight: bold;">📞 مكالمة واردة من...</span>
      </div>
      <div class="row">
        <button onclick="acceptCall()" class="success">قبول ✅</button>
        <button onclick="rejectCall()" class="danger">رفض ✖</button>
      </div>
    </div>

    <!-- 3. تحديد المستلم والتحكم بالمكالمات -->
    <div class="card">
      <div class="row">
        <input type="text" id="targetIdInput" placeholder="معرّف المستلم (مثال: USER_2)">
        <button onclick="startCall(false)" class="secondary">مكالمة صوتية 📞</button>
        <button onclick="startCall(true)">مكالمة فيديو 📹</button>
        <button onclick="endCall()" class="danger">إنهاء المكالمة ✖</button>
      </div>
    </div>

    <!-- 4. شاشات الفيديو والصوت -->
    <div class="video-grid">
      <div class="video-card">
        <video id="localVideo" autoplay playsinline muted></video>
        <div class="video-label">كاميراك (Local)</div>
      </div>
      <div class="video-card">
        <video id="remoteVideo" autoplay playsinline></video>
        <div class="video-label">الطرف الآخر (Remote)</div>
      </div>
    </div>

    <!-- 5. المحادثة النصية -->
    <div class="card">
      <h4>المحادثة النصية</h4>
      <div id="chatBox"></div>
      <div class="row" style="margin-top: 10px;">
        <input type="text" id="messageInput" placeholder="اكتب رسالة..."
          onkeypress="if(event.key==='Enter') sendTextMessage()">
        <button onclick="sendTextMessage()">إرسال ✉️</button>
      </div>
    </div>
  </div>

  <script>
    let ws;
    let myId = "";
    let localStream;
    let peerConnection;
    let pendingOfferData = null; // الاحتفاظ ببيانات المكالمة لحين القبول
    let ringtoneAudio = null;
    let pingInterval = null;

    const SERVER_URL = "wss://go-broker.onrender.com/ws";
    const iceServers = {
      iceServers: [
        { urls: 'stun:stun.l.google.com:19302' },
        { urls: 'stun:stun1.l.google.com:19302' }
      ]
    };

    function playRingtone() {
      stopRingtone();
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      let osc = ctx.createOscillator();
      let gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(440, ctx.currentTime); // نغمة 440Hz
      gain.gain.setValueAtTime(0.1, ctx.currentTime);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start();

      ringtoneAudio = { ctx, osc };
    }

    function stopRingtone() {
      if (ringtoneAudio) {
        try {
          ringtoneAudio.osc.stop();
          ringtoneAudio.ctx.close();
        } catch (e) { }
        ringtoneAudio = null;
      }
    }

    function appendMessage(text, type) {
      const chatBox = document.getElementById('chatBox');
      const msgDiv = document.createElement('div');
      msgDiv.className = `msg ${type}`;
      msgDiv.innerText = text;
      chatBox.appendChild(msgDiv);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    function connectWebSocket() {
      myId = document.getElementById('userIdInput').value.trim();
      if (!myId) return alert('يرجى أدخل معرّفك أولاً');

      ws = new WebSocket(`${SERVER_URL}?userId=${myId}`);

      ws.onopen = () => {

        document.getElementById('status').innerText = 'متصل ✅';
        document.getElementById('status').style.color = '#10b981';
        appendMessage(`تم الاتصال بنجاح بـ ID: ${myId}`, 'system');

        // بدء إرسال نبضات القلب كل 25 ثانية لمنع السيرفر من فصل الاتصال
        if (pingInterval) clearInterval(pingInterval);
        pingInterval = setInterval(() => {
          if (ws.readyState === WebSocket.OPEN) {
            // إرسال رسالة نبض هادئة
            ws.send(JSON.stringify({ type: 'ping', target: 'server' }));
          }
        }, 25000);
      };

      ws.onmessage = async (event) => {
        const data = JSON.parse(event.data);
        if (data.type === 'pong') return; // تجاهل رد النبضات

        switch (data.type) {
          case 'text':
            appendMessage(`${data.sender}: ${data.payload.text}`, 'other');
            break;
          case 'offer':
            handleIncomingOffer(data.sender, data.payload);
            break;
          case 'answer':
            handleAnswer(data.payload);
            break;
          case 'ice_candidate':
            handleIceCandidate(data.payload);
            break;
          case 'reject':
            stopRingtone();
            appendMessage(`${data.sender} قام بفض المكالمة ❌`, 'system');
            endCall();
            break;
        }
      };

      ws.onclose = () => {
        document.getElementById('status').innerText = 'انقطع الاتصال ❌';
        document.getElementById('status').style.color = '#ef4444';

        if (pingInterval) clearInterval(pingInterval);

        // محاولة إعادة الاتصال تلقائياً بعد 3 ثوانٍ (Auto Reconnect)
        setTimeout(() => {
          console.log("حاال محاولة إعادة الاتصال بالسيرفر...");
          connectWebSocket();
        }, 3000);
      };
    }

    function sendTextMessage() {
      const targetId = document.getElementById('targetIdInput').value.trim();
      const input = document.getElementById('messageInput');
      const text = input.value.trim();

      if (!targetId || !text) return alert('أدخل معرّف المستلم ونص الرسالة');

      ws.send(JSON.stringify({ type: 'text', target: targetId, payload: { text } }));
      appendMessage(`أنت: ${text}`, 'me');
      input.value = '';
    }

    async function setupMedia(enableVideo) {
      try {
        localStream = await navigator.mediaDevices.getUserMedia({
          video: enableVideo,
          audio: true
        });
        document.getElementById('localVideo').srcObject = localStream;
      } catch (error) {
        alert('فشل الوصول للكاميرا/الميكروفون: ' + error.message);
      }
    }

    // 1. المتصل يرسل Offer
    async function startCall(video) {
      const targetId = document.getElementById('targetIdInput').value.trim();
      if (!targetId) return alert('أدخل معرّف الشخص الذي تريد الاتصال به');

      await setupMedia(video);
      createPeerConnection(targetId);

      const offer = await peerConnection.createOffer();
      await peerConnection.setLocalDescription(offer);

      appendMessage(`جاري الاتصال بـ ${targetId}... 📞`, 'system');
      sendSignal('offer', targetId, { sdp: offer.sdp, type: offer.type, isVideo: video });
    }

    // 2. المستلم يستقبل التنبيه والصوت
    function handleIncomingOffer(senderId, payload) {
      pendingOfferData = { senderId, payload };
      document.getElementById('targetIdInput').value = senderId;

      // إظهار الشريط وتشغيل الجرس
      document.getElementById('incomingCallerText').innerText = `📞 مكالمة ${payload.isVideo ? 'فيديو' : 'صوتية'} من: ${senderId}`;
      document.getElementById('incomingCallBanner').style.display = 'flex';
      playRingtone();
    }

    // 3. المستلم يوافق على المكالمة
    async function acceptCall() {
      stopRingtone();
      document.getElementById('incomingCallBanner').style.display = 'none';

      if (!pendingOfferData) return;

      const { senderId, payload } = pendingOfferData;
      await setupMedia(payload.isVideo ?? true);
      createPeerConnection(senderId);

      await peerConnection.setRemoteDescription(new RTCSessionDescription(payload));
      const answer = await peerConnection.createAnswer();
      await peerConnection.setLocalDescription(answer);

      appendMessage(`تمت الموافقة على المكالمة مع ${senderId}`, 'system');
      sendSignal('answer', senderId, { sdp: answer.sdp, type: answer.type });
      pendingOfferData = null;
    }

    // 4. المستلم يرفض المكالمة
    function rejectCall() {
      stopRingtone();
      document.getElementById('incomingCallBanner').style.display = 'none';
      if (pendingOfferData) {
        sendSignal('reject', pendingOfferData.senderId, {});
        pendingOfferData = null;
      }
    }

    function createPeerConnection(targetId) {
      peerConnection = new RTCPeerConnection(iceServers);

      if (localStream) {
        localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));
      }

      peerConnection.ontrack = (event) => {
        document.getElementById('remoteVideo').srcObject = event.streams[0];
      };

      peerConnection.onicecandidate = (event) => {
        if (event.candidate) {
          sendSignal('ice_candidate', targetId, event.candidate);
        }
      };
    }

    async function handleAnswer(payload) {
      appendMessage('تم الربط وتأكيد المكالمة! 🎉', 'system');
      await peerConnection.setRemoteDescription(new RTCSessionDescription(payload));
    }

    async function handleIceCandidate(payload) {
      if (peerConnection && peerConnection.remoteDescription) {
        await peerConnection.addIceCandidate(new RTCIceCandidate(payload));
      }
    }

    function sendSignal(type, target, payload) {
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({ type, target, payload }));
      }
    }

    function endCall() {
      stopRingtone();
      if (peerConnection) {
        peerConnection.close();
        peerConnection = null;
      }
      if (localStream) {
        localStream.getTracks().forEach(track => track.stop());
      }
      document.getElementById('localVideo').srcObject = null;
      document.getElementById('remoteVideo').srcObject = null;
      document.getElementById('incomingCallBanner').style.display = 'none';
      appendMessage('تم إنهاء المكالمة', 'system');
    }
  </script>

</body>

</html>
